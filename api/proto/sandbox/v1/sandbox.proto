syntax = "proto3";

package sandbox.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/yashp5/agent-sandbox/gen/sandbox/v1;sandboxv1";

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0; // default value
  SANDBOX_STATE_PENDING = 1;
  SANDBOX_STATE_RUNNING = 2;
  SANDBOX_STATE_HIBERNATED = 3; // saved and running resources released
  SANDBOX_STATE_DESTROYED = 4;
  SANDBOX_STATE_FAILED = 5; // sandbox lifecycle failure
  SANDBOX_STATE_LOST = 6; // host died and live stage is gone
}

enum NetworkProtocol {
  NETWORK_PROTOCOL_UNSPECIFIED = 0;
  NETWORK_PROTOCOL_TCP = 1;
  NETWORK_PROTOCOL_UDP = 2;
}

enum ExecSessionState {
  EXEC_SESSION_STATE_UNSPECIFIED = 0;
  EXEC_SESSION_STATE_RUNNING = 1;
  EXEC_SESSION_STATE_EXITED = 2;
}

enum ProcessSignal {
  PROCESS_SIGNAL_UNSPECIFIED = 0;
  PROCESS_SIGNAL_INTERRUPT = 1;
  PROCESS_SIGNAL_TERMINATE = 2;
  PROCESS_SIGNAL_KILL = 3;
}

// UNSPECIFIED is treated as AUTO. AUTO selects the DIFF path; callers must
// explicitly request FULL when they need the full-snapshot fallback.
// Unrecognized or unsupported explicit modes must fail, without silently
// switching modes. SnapshotRef.mode reports the actual FULL or DIFF mode.
enum SnapshotMode {
  SNAPSHOT_MODE_UNSPECIFIED = 0;
  SNAPSHOT_MODE_AUTO = 1;
  SNAPSHOT_MODE_DIFF = 2;
  SNAPSHOT_MODE_FULL = 3;
}

// Require explicit KEEP or KILL
enum InheritedSessionPolicy {
  INHERITED_SESSION_POLICY_UNSPECIFIED = 0;
  INHERITED_SESSION_POLICY_KEEP = 1; // copied exec processes continue in the new sandbox. Their sessions start detached and can be reached through Attach.
  INHERITED_SESSION_POLICY_KILL = 2; // terminate inherited exec process groups during post-restore, before reporting the new sandbox ready.
}

message ResourceLimits {
  uint32 vcpus = 1; // Number of virtual CPUS
  uint32 memory_mib = 2; // Guest RAM in MiB
  uint32 disk_gib = 3; // Guest disk capacity in GiB
}

message EgressRule {
  string cidr = 1;
  uint32 port = 2;
  NetworkProtocol protocol = 3;
}

// Missing policy or an empty list means deny all egress
// Each rule permits its protocol, destination range, and destination port
// Accept IPv4 CIDRs only in v1
// Ports must be between 1 and 65535; zero does not mean "all ports."
// Reject unspecified or unsupported protocols
// Readme's mandatory blocks-metadata, host addresses, and other sandboxes take precedence over allow rules
message EgressPolicy {
  repeated EgressRule allow_rules = 1;
}

message CreateRequest {
  string template_id = 1; // Which configured template to use
  // Omission selects the template's resource defaults. When supplied, vcpus,
  // memory_mib, and disk_gib must all be greater than zero.
  ResourceLimits resources = 2;
  map<string, string> env = 3; // Env vars for sandbox commands
  // Allowed inactivity before cleanup; defaults to 10 minutes when omitted.
  // A supplied duration must be positive; explicit zero is rejected.
  google.protobuf.Duration idle_timeout = 4;
  // Maximum lifetime, even while active; defaults to 24 hours when omitted.
  // A supplied duration must be positive; explicit zero is rejected.
  google.protobuf.Duration max_lifetime = 5;
  map<string, string> labels = 6; // Caller metadata for organization/filtering
  EgressPolicy egress = 7;
  // Required nonempty client-generated ID, reused unchanged across retries of
  // this request. See SandboxService's request-ID contract for scope, replay,
  // conflicts, and retention.
  string request_id = 8;
}

message GetRequest {
  string sandbox_id = 1;
}

message Sandbox {
  string id = 1;
  SandboxState state = 2;
  ResourceLimits resources = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string template_id = 6;
  map<string, string> labels = 7;
  google.protobuf.Duration idle_timeout = 8;
  google.protobuf.Duration max_lifetime = 9;
  EgressPolicy egress = 10;
  google.protobuf.Timestamp last_active_at = 11;
  google.protobuf.Timestamp expires_at = 12;
  repeated ExecSession exec_sessions = 13;
  string parent_sandbox_id = 14;
  string source_snapshot_id = 15;
}

// page_size = 0, selects a default of 50l reject negative values or above 200
// empty page_token requests the first page
// empty next_page_token means there are no more pages
message ListRequest {
  int32 page_size = 1;
  string page_token = 2;
  map<string, string> label_selector = 3;
  repeated SandboxState states = 4;
}

message ListResponse {
  repeated Sandbox sandboxes = 1;
  string next_page_token = 2;
}

message DestroyRequest {
  string sandbox_id = 1;
}

message DestroyResponse {}

message KeepaliveRequest {
  string sandbox_id = 1;
}

message KeepaliveResponse {
  google.protobuf.Timestamp last_active_at = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ExecSession {
  string session_id = 1; // Id used by attach
  ExecSessionState state = 2; // session lifecycle state
  repeated string argv = 3; // command and arguments
  google.protobuf.Timestamp started_at = 4; // when execution started
  ExecExit exit = 5; // Present when the final result is available
}

message ExecStart {
  string sandbox_id = 1; // where to run
  string session_id = 2; // client generated unique id within that sandbox
  repeated string argv = 3; //executable arguments
  map<string, string> env = 4; // overrides for this command
  string cwd = 5; // working directory inside the guest
  string user = 6; // guest username or numeric uid
  google.protobuf.Duration timeout = 7; // optional command timeout
}

// First message must be start; reject subsequent starts and empty payloads
message ExecInput {
  oneof payload {
    ExecStart start = 1;
    StdinChunk stdin = 2;
    ExecSignal signal = 3;
    ExecAck ack = 4;
  }
}

message ExecStarted {
  string session_id = 1;
}

message OutputChunk {
  uint64 offset = 1;
  // At most 64 KiB (65,536 bytes) per chunk.
  bytes data = 2;
}

message ExecExit {
  oneof result {
    int32 exit_code = 1;
    uint32 signal_number = 2;
  }
  bool timed_out = 3;
  uint64 stdout_end_offset = 4;
  uint64 stderr_end_offset = 5;
}

// A reconnect should now look like this:
//
// Client processes stdout through byte 99.
// Connection drops.
// Client attaches with stdout_offset = 100.
// Server replies with ExecAttached and its next stdin sequence.
// Client resends any unacknowledged stdin chunks.
// Server replays output starting at byte 100.

// Sequences start at 1 and increase by one per chunk.
// The guest accepts chunks in order into a bounded input queue.
// next_sequence = 4 acks acceptance of seq 1, 2, and 3. It does not mean process has consumed those bytes.
// Retransmitted sequences below next_sequence are acks without applying them again.
// When retransmitting, the client must resend the orignal chunk unchanged.
// eof=true closes the process's stdin after that chunks bytes are written. Eof participates in seq too, so reconnecting cannot apply twice.
// Closing the grpc connection does not close process stdin. Only the explicit EOF message does that.
// The client may have only one new stdin chunk awaiting acknowledgement at a
// time. It may still send output acknowledgements and signals while waiting.
// The server must continue receiving those controls while a stdin pipe write
// is blocked, so input backpressure cannot prevent output acknowledgements.
message StdinChunk {
  uint64 sequence = 1;
  // At most 64 KiB (65,536 bytes) per chunk.
  bytes data = 2;
  bool eof = 3;
}

message StdinAck {
  uint64 next_sequence = 1;
}

message ExecSignal {
  ProcessSignal signal = 1;
}

// Offsets are cumulative and exclusive; retain output and exit status until acknowledged
message ExecAck {
  uint64 stdout_offset = 1;
  uint64 stderr_offset = 2;
  bool exit_received = 3;
}

// Omitted offset selects oldest retained output; unavailable positions return OUT_OF_RANGE; successful attachment replaces the previous connection
message AttachStart {
  string sandbox_id = 1;
  string session_id = 2;
  optional uint64 stdout_offset = 3;
  optional uint64 stderr_offset = 4;
}

message ExecAttached {
  string session_id = 1;
  uint64 next_stdin_sequence = 2;
  uint64 stdout_offset = 3;
  uint64 stderr_offset = 4;
}

// First message must be start; reject subsequent starts and empty payloads
message AttachInput {
  oneof payload {
    AttachStart start = 1;
    StdinChunk stdin = 2;
    ExecSignal signal = 3;
    ExecAck ack = 4;
  }
}

message ExecOutput {
  oneof payload {
    ExecStarted started = 1;
    OutputChunk stdout = 2;
    OutputChunk stderr = 3;
    ExecExit exited = 4;
    StdinAck stdin_ack = 5;
    ExecAttached attached = 6;
  }
}

// The first message must contain start, exactly once.
// Data offsets start at zero and must be contiguous.
// The total received bytes must equal size_bytes.
// An empty file uses size_bytes = 0 and needs no data chunks.
// overwrite = false rejects an existing destination with ALREADY_EXISTS.
// Paths are absolute paths inside the guest. The parent directory must already exist.
// This version handles regular files.
message UploadStart {
  string sandbox_id = 1;
  string path = 2;
  uint64 size_bytes = 3;
  bool overwrite = 4;
}

message UploadData {
  uint64 offset = 1;
  // At most 64 KiB (65,536 bytes) per chunk.
  bytes data = 2;
}

message UploadChunk {
  oneof payload {
    UploadStart start = 1;
    UploadData data = 2;
  }
}

message UploadResponse {
  string path = 1;
  uint64 bytes_written = 2;
}

message DownloadRequest {
  string sandbox_id = 1;
  string path = 2;
}

message DownloadChunk {
  uint64 offset = 1;
  // At most 64 KiB (65,536 bytes) per chunk.
  bytes data = 2;
}

message SnapshotRequest {
  string sandbox_id = 1;
  SnapshotMode mode = 2;
  // Required nonempty client-generated ID, reused unchanged across retries of
  // this request. See SandboxService's request-ID contract for scope, replay,
  // conflicts, and retention.
  string request_id = 3;
}

// id identifies a server-managed snapshot; it is not a host filesystem path.
// mode reports the actual capture mode, FULL or DIFF.
// base_snapshot_id identifies the base when one is required; otherwise it is empty.
// The snapshot store retains any dependencies needed for restoration.
// The stored metadata also records compatibility information such as CPU and Firecracker version, which the server checks during restore.
message SnapshotRef {
  string id = 1;
  string source_sandbox_id = 2;
  google.protobuf.Timestamp created_at = 3;
  string template_id = 4;
  ResourceLimits resources = 5;
  SnapshotMode mode = 6;
  string base_snapshot_id = 7;
}

// Require a running parent and count > 0; enforce a server-configured maximum.
// All children come from the same captured state.
// Each child receives a new sandbox ID and independent writable state.
// Return success only when all requested children are ready.
// Resume the parent after capture; child restoration happens afterward.
// If child creation fails partway through, clean up children created by that attempt. Cleanup cannot reverse external side effects from a child that briefly ran.
message ForkRequest {
  string sandbox_id = 1;
  uint32 count = 2;
  SnapshotMode mode = 3;
  InheritedSessionPolicy inherited_sessions = 4;
  // Required nonempty client-generated ID, reused unchanged across retries of
  // this request. See SandboxService's request-ID contract for scope, replay,
  // conflicts, and retention.
  string request_id = 5;
}

message ForkResponse {
  SnapshotRef snapshot = 1;
  repeated Sandbox children = 2;
}

message RestoreRequest {
  string snapshot_id = 1;
  InheritedSessionPolicy inherited_sessions = 2;
  // Required nonempty client-generated ID, reused unchanged across retries of
  // this request. See SandboxService's request-ID contract for scope, replay,
  // conflicts, and retention.
  string request_id = 3;
}

// Request-ID contract for Create, Snapshot, Fork, and Restore:
// The client must supply a nonempty ID once per logical operation and reuse it
// across retries. The key is scoped to the authenticated caller and RPC method.
// The same key with the same request refers to the existing operation: wait for
// it if still pending, or replay its recorded outcome if complete. Do not start
// another operation. Reusing the key with a different request is INVALID_ARGUMENT.
// Completed records must be retained for at least 24 hours after completion;
// unresolved records must remain until their outcomes are known. Retry protection
// is guaranteed only while the record is retained. A replayed response describes
// the original outcome and may be stale; use Get for current sandbox state.
service SandboxService {
  rpc Create(CreateRequest) returns (Sandbox); // success means the new sandbox is ready to accept exec
  rpc Get(GetRequest) returns (Sandbox); // includes running and exited sessions
  rpc List(ListRequest) returns (ListResponse);
  rpc Destroy(DestroyRequest) returns (DestroyResponse);
  rpc Keepalive(KeepaliveRequest) returns (KeepaliveResponse);

  rpc Exec(stream ExecInput) returns (stream ExecOutput); // client sends start + stdin + signals; server streams stdout/stderr chunks with byte offsets, then exit status.
  rpc Attach(stream AttachInput) returns (stream ExecOutput); // re-attach to a live exec session from a byte offset: after a client reconnect, or in a fork child.

  // Publish the completed upload atomically and return success only afterward.
  // Enforce overwrite=false atomically at publication, not just with an earlier
  // existence check, so a concurrently created destination is not replaced.
  rpc Upload(stream UploadChunk) returns (UploadResponse);
  // Completion requires a successful final gRPC status, not merely receipt of
  // some chunks. No consistent snapshot is guaranteed during concurrent writes.
  rpc Download(DownloadRequest) returns (stream DownloadChunk);

  rpc Snapshot(SnapshotRequest) returns (SnapshotRef); // pause, capture memory + disk, resume
  rpc Fork(ForkRequest) returns (ForkResponse); // n live children of a running sandbox
  rpc Restore(RestoreRequest) returns (Sandbox); // new sandbox from a stored snapshot, success means the new sandbox is ready to accept exec
}
